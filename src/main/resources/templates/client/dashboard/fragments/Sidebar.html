<aside th:fragment="sidebar" class="w-[290px] shrink-0 rounded-xl bg-white border border-gray-200 shadow-sm p-4">
    <div class="mb-3 rounded-xl bg-gray-50 px-4 py-3">
        <div class="flex items-center gap-2 text-gray-500">
            <i class="ph ph-hand-waving text-[20px]"></i>
            <span class="text-[14px] font-medium">Xin chào</span>
        </div>
        <p class="mt-1 truncate text-[18px] font-bold leading-6 text-gray-900"
           th:text="${session.account != null and session.account.userName != null ? session.account.userName : 'Khách'}"></p>
    </div>

    <div class="space-y-3 mb-5">
        <button type="button"
                class="w-full rounded-xl border border-[#d7e9ff] bg-[#eef6ff] text-[#1f2d8f] font-medium py-2.5 text-sm">
            Cho phép tìm kiếm CV
        </button>
        <button type="button"
                class="w-full rounded-xl border border-[#dfe2e8] bg-white text-gray-700 font-medium py-2.5 text-sm">
            Nhà tuyển dụng xem CV
        </button>
    </div>

    <nav class="space-y-1">
        <a th:href="@{/dashboard}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'overview'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-squares-four text-[22px]"></i>
            <span>Tổng quan</span>
        </a>
        <a th:href="@{/dashboard/attachment}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'attachment'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-file-text text-[22px]"></i>
            <span>Hồ sơ đính kèm</span>
        </a>
        <a th:href="@{/dashboard/profile}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'profile'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-user-circle text-[22px]"></i>
            <span>Hồ sơ ITviec</span>
        </a>
        <a th:href="@{/dashboard/my-jobs}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'my-jobs'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-briefcase text-[22px]"></i>
            <span>Việc làm của tôi</span>
        </a>
        <a th:href="@{/dashboard/job-invitations}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'job-invitations'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-handshake text-[22px]"></i>
            <span>Lời mời công việc</span>
            <span class="ml-auto rounded-full bg-red-500 text-white text-[10px] font-semibold px-1.5 py-0.5">0</span>
        </a>
        <a th:href="@{/dashboard/email-subscriptions}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'email-subscriptions'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-envelope text-[22px]"></i>
            <span>Đăng ký nhận email</span>
        </a>
        <a th:href="@{/dashboard/notifications}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'notifications'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-bell text-[22px]"></i>
            <span>Thông báo</span>
        </a>
        <a th:href="@{/dashboard/settings}"
           class="flex items-center gap-3 rounded-xl px-3 py-3 text-[15px] font-medium transition"
           th:classappend="${activeItem == 'settings'} ? 'bg-[#f9e7e7] text-red-500 border border-[#f3d0d0]' : 'text-gray-700 hover:bg-gray-50'">
            <i class="ph ph-gear text-[22px]"></i>
            <span>Cài đặt</span>
        </a>
    </nav>
</aside>
