<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout/ClientLayout}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' | RecruitOS'">Tổng quan | RecruitOS</title>
</head>

<body>
<div layout:fragment="content" class="bg-[#f3f5f7] min-h-screen py-6">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-start gap-6">
            <div th:replace="client/dashboard/fragments/Sidebar :: sidebar"></div>

            <main class="flex-1 min-w-0">
                <!-- Phần thông tin user -->
                <div class="rounded-2xl border border-[#e5e7eb] bg-white p-4 shadow-sm">
                    <div class="flex items-center justify-between gap-4 pb-4">
                        <div class="flex items-center gap-4 flex-1">
                            <div class="h-[80px] w-[80px] rounded-full flex items-center justify-center shadow-sm overflow-hidden">
                                <img th:src="${session.account.avatar != null and !session.account.avatar.isEmpty()
                              ? session.account.avatar
                              : '/images/default-user.png'}"
                                     alt="User Avatar"
                                     class="rounded-full object-cover"/>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center gap-3">
                                    <h1 class="text-[30px] font-bold text-gray-900"
                                        th:text="${session.account.userName}"></h1>
                                </div>
                                <div class="mt-2 flex items-center gap-3 text-sm text-gray-600">
                                    <div class="flex items-center gap-2 rounded-full bg-white border border-gray-200 px-3 py-1.5 shadow-sm">
                                        <i class="ph ph-magnifying-glass text-[18px]"></i>
                                        <span>Đang chủ động tìm việc</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <a th:href="@{/dashboard/profile}"
                           class="inline-flex items-center justify-center rounded-lg bg-[#1f2d8f] px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-[#1b236f] transition">
                            Cập nhật hồ sơ
                        </a>
                    </div>

                    <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-[#fafafa] px-3 py-3 mt-4">
                        <i class="ph ph-envelope-simple text-[18px] text-gray-500"></i>
                        <span class="text-[15px] text-gray-700"
                              th:text="${session.account.email}"></span>
                    </div>
                </div>

                <!-- Thông báo NTD xem CV -->
                <div class="mt-5 rounded-2xl border border-[#cfe6c8] bg-[#eaf7ea] p-4 shadow-sm">
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <div class="h-12 w-12 rounded-xl bg-white border border-[#cfe6c8] flex items-center justify-center text-[#2b7a2b] text-xl">
                                <i class="ph ph-file-text"></i>
                            </div>
                            <div>
                                <p class="text-[15px] font-semibold text-gray-900">Nhà tuyển dụng xem CV</p>
                                <p class="text-[13px] text-gray-600">CV ẩn danh của bạn được hiển thị sau khi đăng
                                    tải.</p>
                            </div>
                        </div>
                        <span class="rounded-full bg-[#d4f0d4] text-[#2a7a2b] text-[11px] font-semibold px-2.5 py-1">MỚI</span>
                    </div>
                </div>

                <!-- KHU VỰC QUẢN LÝ CV (Đã tách ID input thành cvFileInput1 và cvFileInput2 để tránh lỗi trùng lặp) -->
                <div class="mt-5 rounded-2xl border border-[#d9dfe6] bg-white p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[27px] font-bold text-gray-900">Hồ sơ đính kèm</h2>
                        <span class="rounded-full bg-[#f1f5f9] text-[#1f2d8f] text-[11px] font-semibold px-2.5 py-1">MỚI</span>
                    </div>

                    <!-- Trường hợp 1: Chưa có CV -->
                    <div th:if="${latestCV == null}"
                         class="rounded-2xl border border-dashed border-[#d1d5db] bg-[#f5f5f5] px-5 py-8 text-center">
                        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-white shadow-sm text-[28px] text-gray-400 border border-gray-200">
                            <i class="ph ph-file-arrow-up"></i>
                        </div>
                        <p class="mt-4 text-[15px] text-gray-600 max-w-lg mx-auto">
                            Tải lên CV của bạn để ứng tuyển nhanh chóng và thuận tiện cho các nhà tuyển dụng.
                        </p>
                        <button type="button" onclick="document.getElementById('cvFileInput1').click()"
                                class="mt-5 inline-flex items-center justify-center rounded-xl bg-[#ee3f3f] px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-[#d93333] transition">
                            Tải lên ngay
                        </button>
                        <input type="file" id="cvFileInput1" accept=".pdf,.docx" style="display: none;"
                               onchange="uploadCV(this)">
                    </div>

                    <!-- Trường hợp 2: Đã có CV -->
                    <div th:if="${latestCV != null}" class="rounded-2xl border border-[#d9dfe6] bg-white p-5 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="h-14 w-14 rounded-xl bg-[#eaf7ea] border border-[#cfe6c8] flex items-center justify-center text-[#2b7a2b] text-2xl">
                                    <i class="ph ph-file-text"></i>
                                </div>
                                <div>
                                    <p class="text-[16px] font-semibold text-gray-900">CV của bạn</p>
                                    <p class="text-[13px] text-gray-500 mt-1">Đã tải lên thành công</p>
                                    <p class="text-[12px] text-gray-400 mt-1"
                                       th:text="'Cập nhật lần cuối: ' + ${#temporals.format(latestCV.createdAt, 'HH:mm dd/MM/yyyy')}">
                                    </p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <a th:href="${latestCV.fileUrl}" target="_blank"
                                   class="inline-flex items-center justify-center rounded-lg border border-[#d8dfe8] bg-white px-4 py-2 text-sm font-semibold text-[#1f2d8f] hover:bg-[#f8f9ff] transition">
                                    <i class="ph ph-eye mr-2"></i>
                                    Xem CV
                                </a>
                                <button type="button" onclick="document.getElementById('cvFileInput2').click()"
                                        class="inline-flex items-center justify-center rounded-xl bg-[#ee3f3f] px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#d93333] transition">
                                    <i class="ph ph-arrows-clockwise mr-2"></i>
                                    Cập nhật
                                </button>
                                <input type="file" id="cvFileInput2" accept=".pdf,.docx" style="display: none;"
                                       onchange="uploadCV(this)">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Các phần thống kê bên dưới giữ nguyên -->
                <!-- ... -->
            </main>
        </div>
    </div>

    <!-- JavaScript xử lý upload CV -->
    <script>
        async function uploadCV(input) {
            const file = input.files[0];
            if (!file) return;

            // Kiểm tra dung lượng (Ví dụ giới hạn 5MB)
            const maxSize = 5 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('File quá lớn! Vui lòng chọn file có dung lượng dưới 5MB.');
                input.value = ''; // Reset input
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // Hiển thị thông báo đang xử lý (tùy chọn)
            document.body.style.cursor = 'wait';

            try {
                // Gọi tới API Backend Spring Boot (Thay đổi đường dẫn API cho khớp với Controller của bạn)
                const response = await fetch("/dashboard/cv/upload", {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Upload thành công thì load lại trang để Thymeleaf hiển thị thông tin mới
                    window.location.reload();
                } else {
                    const errorText = await response.text();
                    alert('Tải lên CV thất bại: ' + errorText);
                }
            } catch (error) {
                alert('Lỗi kết nối đến máy chủ: ' + error.message);
            } finally {
                document.body.style.cursor = 'default';
                input.value = ''; // Reset input để có thể chọn lại chính file đó nếu cần
            }
        }
    </script>
</div>
</body>
</html>
