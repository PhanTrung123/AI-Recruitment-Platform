<!-- MODAL FRAGMENT -->
<div th:fragment="editProfileModal" id="editProfileModal"
     class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">

    <!-- Lớp phủ mờ nền (Backdrop overlay) tạo hiệu ứng Highlight Modal -->
    <div id="modalBackdrop" class="fixed inset-0 bg-black/60 transition-opacity"></div>

    <!-- Hộp Modal Dialog chính -->
    <div class="relative w-full max-w-4xl rounded-2xl bg-white shadow-2xl overflow-hidden my-8 z-10">

        <!-- Header -->
        <div class="flex items-center justify-between px-8 pt-6 pb-2">
            <h2 class="text-2xl font-bold text-gray-900">Thông tin cá nhân</h2>
            <button type="button"
                    class="closeModalBtn text-gray-400 hover:text-gray-600 transition-colors p-1 cursor-pointer">
                <i class="ph ph-x text-2xl"></i>
            </button>
        </div>

        <!-- Body / Content -->
        <div class="p-8 pt-4 flex flex-col md:flex-row gap-8">

            <!-- Cột trái: Avatar & Thao tác -->
            <div class="w-full md:w-1/3 flex flex-col items-center pt-2">
                <div class="w-40 h-40 rounded-full overflow-hidden border border-gray-200 shadow-sm relative mb-4 bg-slate-100 flex items-center justify-center">
                    <img src="https://placehold.co/200x200/475569/ffffff?text=Avatar" alt="User Avatar"
                         class="object-cover w-full h-full"/>
                </div>

                <!-- Nút Sửa / Xoá -->
                <div class="flex items-center gap-6">
                    <button type="button"
                            class="flex items-center gap-1.5 font-semibold text-red-600 hover:text-red-700 text-base transition-colors cursor-pointer">
                        <i class="ph ph-camera text-xl"></i> Sửa
                    </button>
                    <button type="button"
                            class="flex items-center gap-1.5 font-semibold text-gray-700 hover:text-red-600 text-base transition-colors cursor-pointer">
                        <i class="ph ph-trash text-xl"></i> Xoá
                    </button>
                </div>
            </div>

            <!-- Cột phải: Form nhập thông tin -->
            <div class="w-full md:w-2/3 flex flex-col gap-4">

                <!-- Họ và Tên -->
                <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600">
                    <label class="block text-xs font-medium text-gray-500 mb-0.5">
                        Họ và Tên <span class="text-red-500">*</span>
                    </label>
                    <input type="text" value="Trung Phan"
                           class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none"/>
                </div>

                <!-- Chức danh -->
                <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600">
                    <label class="block text-xs font-medium text-gray-500 mb-0.5">
                        Chức danh <span class="text-red-500">*</span>
                    </label>
                    <input type="text" value="User"
                           class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none"/>
                </div>

                <!-- Grid 2 cột: Email & Số điện thoại -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Email (Disabled/Readonly) -->
                    <div class="relative rounded-lg border border-gray-200 bg-gray-50 px-3.5 py-2">
                        <label class="block text-xs font-medium text-gray-400 mb-0.5">
                            Địa chỉ email
                        </label>
                        <input type="email" value="phanquangtrung30042004@gmail.co" readonly
                               class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none truncate cursor-not-allowed"/>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600">
                        <label class="block text-xs font-medium text-gray-500 mb-0.5">
                            Số điện thoại <span class="text-red-500">*</span>
                        </label>
                        <input type="tel" value="0708110429"
                               class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none"/>
                    </div>
                </div>

                <!-- Grid 2 cột: Ngày sinh & Giới tính -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600 flex items-center justify-between">
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-gray-500 mb-0.5">
                                Ngày sinh <span class="text-red-500">*</span>
                            </label>
                            <input type="text" value="01/10/2026"
                                   class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none"/>
                        </div>
                        <i class="ph ph-calendar-blank text-xl text-gray-700 pointer-events-none"></i>
                    </div>

                    <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600 flex items-center justify-between">
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-gray-400 mb-0.5">
                                Giới tính
                            </label>
                            <select class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none appearance-none cursor-pointer">
                                <option value="Nam" selected>Nam</option>
                                <option value="Nữ">Nữ</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>
                        <i class="ph ph-caret-down text-sm text-gray-700 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Grid 2 cột: Tỉnh/Thành phố & Địa chỉ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600 flex items-center justify-between">
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-gray-500 mb-0.5">
                                Tỉnh/Thành phố hiện tại <span class="text-red-500">*</span>
                            </label>
                            <select class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none appearance-none cursor-pointer">
                                <option value="Đà Nẵng" selected>Đà Nẵng</option>
                                <option value="Hồ Chí Minh">Hồ Chí Minh</option>
                                <option value="Hà Nội">Hà Nội</option>
                            </select>
                        </div>
                        <i class="ph ph-caret-down text-sm text-gray-700 pointer-events-none"></i>
                    </div>

                    <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600">
                        <label class="block text-xs font-medium text-gray-400 mb-0.5">
                            Địa chỉ (Tên đường, quận/huyện,...)
                        </label>
                        <input type="text" value="Ha Huy Tap"
                               class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none"/>
                    </div>
                </div>

                <!-- Link cá nhân -->
                <div class="relative rounded-lg border border-gray-300 px-3.5 py-2 focus-within:border-gray-600 focus-within:ring-1 focus-within:ring-gray-600">
                    <label class="block text-xs font-medium text-gray-400 mb-0.5">
                        Link cá nhân (Linkedin, porfolio,...)
                    </label>
                    <input type="url" placeholder=""
                           class="w-full bg-transparent text-sm font-semibold text-gray-900 focus:outline-none"/>
                </div>

            </div>
        </div>

        <!-- Footer Buttons -->
        <div class="flex items-center justify-end gap-3 px-8 py-5 border-t border-gray-100">
            <button type="button"
                    class="closeModalBtn px-6 py-2.5 rounded-lg text-sm font-bold text-gray-700 hover:bg-gray-100 transition-colors cursor-pointer">
                Huỷ
            </button>
            <button type="button"
                    class="px-8 py-2.5 rounded-lg text-sm font-bold text-white bg-[#ea2840] hover:bg-red-700 transition-colors shadow-sm cursor-pointer">
                Lưu
            </button>
        </div>

    </div>
</div>
