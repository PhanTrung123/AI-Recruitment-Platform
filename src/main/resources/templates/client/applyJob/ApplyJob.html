<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body>
<div class="z-10 bg-gray-50 pb-16">
    <div class="bg-gradient-to-r from-gray-900 via-gray-900 to-[#3b0909] pt-6 pb-32">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between text-white">
                <a href="javascript:history.back()"
                   class="flex items-center gap-1 text-sm font-medium hover:opacity-85 transition-opacity">
                    <i class="ph ph-caret-left text-lg"></i>Back
                </a>
                <a class="flex items-center">
                    <img src="/images/logo.png" th:src="@{/images/logo.png}" alt="RecruitOS"
                         class="h-10 md:h-12 w-auto object-contain"/>
                </a>

                <div class="w-12"></div>
            </div>
        </div>
    </div>
    <div class="max-w-3xl mx-auto px-4 -mt-20">
        <form th:action="@{/apply-job/{jobId}(jobId=${job.job_id})}" method="post" enctype="multipart/form-data"
              class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-8">
            <h1 class="text-xl sm:text-[22px] font-bold text-[#121212] leading-snug tracking-tight mb-6"
                th:text="${job.jobName}">
            </h1>
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-2">
                    Your CV <span class="text-red-500">*</span>
                </label>
                <!-- Option 1: Upload new CV -->
                <div class="mt-4 border-2 border-red-500 rounded-xl p-6 bg-white hover:bg-red-50/30 transition-colors">
                    <div class="flex items-center gap-3 mb-2">
                        <input type="radio" name="cv_option" id="upload_cv" value="upload" checked
                               class="w-4 h-4 text-red-600 focus:ring-red-500"
                               onchange="toggleCvOption('upload')">
                        <label for="upload_cv" class="text-sm font-medium text-gray-900 cursor-pointer">Upload a new
                            CV</label>
                    </div>
                    <div id="upload_cv_section" class="ml-7 flex flex-wrap items-center gap-3">
                        <label class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-red-500 text-red-600 bg-white hover:bg-red-50 text-sm font-semibold cursor-pointer shadow-sm transition-all">
                            <i class="ph ph-upload-simple text-base"></i>
                            Choose file
                            <input type="file" name="cvFile" class="hidden" accept=".pdf,.docx"
                                   onchange="updateFileName(this)">
                        </label>
                        <span id="file_name" class="text-sm text-gray-500">No file chosen</span>
                    </div>
                    <div id="cv_error" th:if="${errorMessage}"
                         th:text="${errorMessage}"
                         class="text-red-600 text-sm mt-2">
                    </div>
                </div>
                <!-- Option 2: Use existing CV -->
                <div th:if="${userCv != null}"
                     class="mt-4 border-2 border-gray-300 rounded-xl p-6 bg-white hover:bg-gray-50 transition-colors">
                    <div class="flex items-center gap-3 mb-2">
                        <input type="radio" name="cv_option" id="existing_cv" value="existing"
                               class="w-4 h-4 text-red-600 focus:ring-red-500"
                               onchange="toggleCvOption('existing')">
                        <label for="existing_cv" class="text-sm font-medium text-gray-900 cursor-pointer">Use existing
                            CV</label>
                    </div>
                    <div id="existing_cv_section" class="ml-7 hidden">
                        <input type="hidden" name="existingCvId" th:value="${userCv.cvs_id}">
                        <div class="flex items-center gap-2">
                            <i class="ph ph-file-pdf text-2xl text-red-600"></i>
                            <div>
                                <p class="text-sm font-medium text-gray-900"
                                   th:text="${userCv.fileUrl}" id="cv_filename">CV File</p>
                                <p class="text-xs text-gray-500"
                                   th:text="${#temporals.format(userCv.createdAt, 'dd/MM/yyyy HH:mm')}">Uploaded
                                    date</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="space-y-4 mb-6">
                <h2 class="text-base font-bold text-gray-900">Personal information</h2>
                <!-- Full name -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">
                        Full name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="fullName"
                           th:value="${session.account.userName}"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">
                        Phone number <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="phone" th:value="${session.account.phone}"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">
                        Preferred work location <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <select class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent bg-white appearance-none cursor-pointer">
                            <option selected>Đà Nẵng</option>
                            <option>Hồ Chí Minh</option>
                            <option>Hà Nội</option>
                        </select>
                        <div class="absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
                            <i class="ph ph-caret-down text-sm"></i>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mt-1">1/3 locations</p>
                </div>
            </div>
            <!-- 2. Cover Letter / Answer -->
            <div class="mb-8">
                <div class="flex items-center gap-1 mb-1">
                    <label class="text-sm font-bold text-gray-900">Cover Letter/Answer</label>
                    <i class="ph ph-info text-gray-400 text-sm cursor-pointer" title="Thông tin bổ sung"></i>
                    <span class="text-xs text-gray-400 font-normal">(Optional)</span>
                </div>
                <p class="text-xs text-gray-600 mb-2">What skills, work projects or achievements make you a strong
                    candidate for this position?</p>
                <textarea name="coverLetter" rows="4"
                          placeholder="Short introduction or answers to the employer’s questions (if any)."
                          class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent placeholder-gray-400 resize-none"></textarea>
                <div class="text-left text-xs text-gray-400 mt-1">500 of 500 characters remaining</div>
            </div>
            <button type="submit"
                    class="w-full py-3 px-4 bg-[#ed1b24] hover:bg-[#d81920] active:scale-[0.99] transition-all text-white font-bold rounded-xl shadow-md text-sm">
                Send my CV
            </button>
        </form>

    </div>
</div>

<script>
    function toggleCvOption(option) {
        const uploadSection = document.getElementById('upload_cv_section');
        const existingSection = document.getElementById('existing_cv_section');
        const uploadInput = document.querySelector('input[name="cvFile"]');
        const existingInput = document.querySelector('input[name="existingCvId"]');
        const errorMessage = document.getElementById('cv_error');

        if (errorMessage) {
            errorMessage.style.display = 'none';
        }
        if (option === 'upload') {
            uploadSection.classList.remove('hidden');
            existingSection?.classList.add('hidden');

            if (existingInput) existingInput.disabled = true;
        } else {
            uploadSection.classList.add('hidden');
            existingSection?.classList.remove('hidden');

            if (existingInput) existingInput.disabled = false;
            if (uploadInput) uploadInput.value = '';
        }
    }

    function updateFileName(input) {
        const fileNameSpan = document.getElementById('file_name');
        if (input.files && input.files.length > 0) {
            fileNameSpan.textContent = input.files[0].name;
        } else {
            fileNameSpan.textContent = 'No file chosen';
        }
    }

    // Extract filename from URL on page load
    document.addEventListener('DOMContentLoaded', function () {
        const cvFilenameElement = document.getElementById('cv_filename');
        if (cvFilenameElement && cvFilenameElement.textContent) {
            const url = cvFilenameElement.textContent;
            const filename = url.substring(url.lastIndexOf('/') + 1);
            if (filename && filename !== url) {
                cvFilenameElement.textContent = filename;
            }
        }
    });


</script>
</body>
</html>
