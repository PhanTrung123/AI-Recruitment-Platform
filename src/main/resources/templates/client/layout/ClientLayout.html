<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <title layout:title-pattern="$CONTENT_TITLE | RecruitOS">RecruitOS</title>

    <style>
        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-33.333%);
            }
        }

        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 18s linear infinite;
            will-change: transform;
        }

        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>

<body class="bg-gray-50">

<!-- HEADER -->
<div class="bg-gradient-to-r from-gray-900 via-gray-900 to-[#3b0909] sticky top-0 z-50">
    <div th:replace="client/fragments/Header::header"></div>
</div>

<div layout:fragment="content"></div>

<!-- FOOTER -->
<footer th:replace="client/fragments/Footer::footer"></footer>

<script th:src="@{/js/ClientLayout.js}"></script>

</body>
</html>
