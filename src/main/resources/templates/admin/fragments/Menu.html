<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

<div th:fragment="menu">
    <div id="menuOverlay" class="hidden fixed inset-0 bg-black/40 z-40"></div>
    <aside id="adminMenu"
           class="bg-white border-r border-slate-200 h-screen shrink-0 flex flex-col w-60 max-lg:w-16 max-md:w-72 max-md:fixed max-md:left-0 max-md:top-0 max-md:z-50 max-md:-translate-x-full max-md:transition-transform max-md:duration-300 max-md:ease-in-out">
        <div class="h-16 px-5 border-b border-slate-200 flex items-center justify-between max-lg:justify-center max-lg:px-3 max-md:justify-between max-md:px-5">
            <a th:href="@{/admin}" class="flex items-center">
                <img src="/images/logo.png" alt="RecruitOS" class="w-9 h-9 object-contain shrink-0">

                <span class="ml-3 text-lg font-bold text-slate-800 max-lg:hidden">
                    RecruitOS
                </span>
            </a>
            <button id="closeMenu" type="button"
                    class="hidden max-md:flex w-9 h-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="px-4 py-4 max-lg:hidden max-md:block">
            <div class="flex items-center justify-between text-xs font-medium text-slate-500 mb-2 px-2">
                <span>MÔI TRƯỜNG</span>
                <span class="flex items-center gap-1 text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    Production
                </span>
            </div>
        </div>

        <nav class="px-3 space-y-1 flex-1 max-lg:px-2 max-lg:[&_a]:justify-center max-lg:[&_a]:gap-0 max-lg:[&_a]:px-2 max-lg:[&_a]:text-[0px] max-lg:[&_a>i]:text-lg max-md:px-3 max-md:[&_a]:justify-start max-md:[&_a]:gap-3 max-md:[&_a]:px-3 max-md:[&_a]:text-sm max-md:[&_a>i]:text-lg">
            <a
                    th:href="@{/admin}"
                    th:classappend="${activeMenu == 'dashboards'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap"
            >
                <i class="ph ph-squares-four text-lg shrink-0"></i> Tổng quan
            </a>

            <a th:href="@{/admin/users}"
               th:classappend="${activeMenu == 'users'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
               class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-users text-lg shrink-0"></i> Quản lý Users
            </a>

            <a th:href="@{/admin/companies}"
               th:classappend="${activeMenu == 'companies'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
               class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-buildings text-lg shrink-0"></i> Quản lý Công ty
            </a>

            <a
                    th:href="@{/admin/jobs}"
                    th:classappend="${activeMenu == 'jobs'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-briefcase text-lg shrink-0"></i> Quản lý Việc làm
            </a>

            <a
                    th:href="@{/admin/CVs}"
                    th:classappend="${activeMenu == 'CVs'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-file-text text-lg shrink-0"></i> Quản lý Hồ sơ & Ứng tuyển
            </a>

            <a
                    th:href="@{/admin/blogs}"
                    th:classappend="${activeMenu == 'blogs'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium"
            >
                <i class="ph ph-article text-lg shrink-0"></i> Quản lý Bài viết
            </a>

            <a
                    th:href="@{/admin/categories}"
                    th:classappend="${activeMenu == 'categories'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium"
            >
                <i class="ph ph-article text-lg shrink-0"></i> Quản lý Danh mục
            </a>

            <a
                    th:href="@{/admin/domains}"
                    th:classappend="${activeMenu == 'domains'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-buildings text-lg shrink-0"></i> Danh mục lĩnh vực
            </a>

            <a
                    th:href="@{/admin/expertises}"
                    th:classappend="${activeMenu == 'expertises'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-buildings text-lg shrink-0"></i> Quản lý chuyên môn
            </a>

            <a
                    th:href="@{/admin/titles}"
                    th:classappend="${activeMenu == 'titles'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-buildings text-lg shrink-0"></i> Quản lý vị trí
            </a>

            <a
                    th:href="@{/admin/skills}"
                    th:classappend="${activeMenu == 'skills'} ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg font-medium whitespace-nowrap">
                <i class="ph ph-tag text-lg shrink-0"></i> Quản lý các kỹ năng
            </a>

            <!--            <a-->
            <!--                    href="#"-->
            <!--                    class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium mt-4 whitespace-nowrap"-->
            <!--            >-->
            <!--                <i class="ph ph-gear text-lg shrink-0"></i> Cài đặt-->
            <!--            </a>-->
        </nav>

        <!-- SUPPORT -->
        <div class="p-4 bg-slate-50 border-t border-slate-200 max-lg:p-3">

            <div class="flex items-center gap-3 max-lg:justify-center max-md:justify-start">

                <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-headset"></i>
                </div>

                <div class="max-lg:hidden">
                    <p class="font-medium text-xs">Hỗ trợ kỹ thuật</p>
                    <p class="text-[11px] text-slate-500">SLA 99.99% Core</p>
                </div>

            </div>

        </div>

    </aside>

</div>

</body>
</html>
