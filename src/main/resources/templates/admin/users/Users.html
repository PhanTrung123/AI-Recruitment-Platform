<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/AdminLayout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content">
    <div class="w-full px-6 py-4">
        <div
                class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6"
        >
            <h2 class="text-xl font-bold text-slate-800">List Users</h2>
            <form class="relative w-full sm:w-80">
                <button type="submit"
                        class="ph ph-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">
                </button>
                <input
                        name="name"
                        type="text"
                        placeholder="Search User..."
                        class="w-full border-slate-200 text-md font-semibold text-slate-600  px-4 py-3 rounded-full border focus:border-blue-500 focus:bg-white outline-none transition-all"
                />
            </form>

            <div
                    class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto"
            >
                <a th:href="@{/admin/users/add}"
                   id="openModalBtn"
                   class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-5 py-2 rounded-full flex items-center justify-center gap-2 text-sm font-medium transition-all shadow-sm"
                >
                    <span>Add</span>
                    <i class="ph ph-plus font-bold text-base"></i>
                </a>
            </div>
        </div>
        <div
                class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm"
        >
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr
                            class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider"
                    >
                        <th class="py-4 px-6 w-16">STT</th>
                        <th class="py-4 px-6">Avatar</th>
                        <th class="py-4 px-6">User Name</th>
                        <th class="py-4 px-6">Email</th>
                        <th class="py-4 px-6">Phone</th>
                        <th class="py-4 px-6">Role</th>
                        <th class="py-4 px-6 text-center w-32">Action</th>
                    </tr>
                    </thead>
                    <tbody class="text-sm">
                    <tr th:each="user, iterStat : ${page.content}"
                        class="border-b border-slate-100 hover:bg-slate-50 transition-colors"
                    >
                        <td th:text="${iterStat.index + page.number * page.size + 1}"
                            class="py-4 px-6 font-medium text-slate-700"></td>
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-3">
                                <img
                                        th:src="${user.avatar != null and !user.avatar.isEmpty() ? user.avatar : 'https://ui-avatars.com/api/?name=' + user.userName + '&background=random'}"
                                        th:alt="${user.userName}"
                                        class="w-9 h-9 rounded-full border border-slate-200 shadow-sm"
                                />
                            </div>
                        </td>
                        <td class="py-4 px-6 text-slate-600" th:text="${user.userName}"></td>
                        <td class="py-4 px-6 text-slate-600" th:text="${user.email}"></td>
                        <td class="py-4 px-6 text-slate-600" th:text="${user.phone}"></td>
                        <td class="py-4 px-6">
                    <span
                            class="px-2.5 py-1 rounded bg-blue-50 text-blue-700 border border-blue-100 text-[11px] font-bold tracking-wide"
                            th:text="${user.role}"
                    ></span>
                        </td>
                        <td class="py-4 px-6">
                            <div class="flex items-center justify-center gap-2">
                                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                                   class="w-8 h-8 flex items-center justify-center rounded-lg border border-blue-200 bg-blue-50 text-blue-600 hover:bg-blue-100 transition-all duration-200"
                                   title="Chỉnh sửa"
                                >
                                    <i class="ph ph-pencil-simple text-[15px]"></i>
                                </a>

                                <button
                                        type="button"
                                        class="delete-btn w-8 h-8 flex items-center justify-center rounded-lg border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 transition-all duration-200"
                                        th:data-url="@{/admin/users/delete/{id}(id=${user.id})}"
                                        title="Xóa"
                                >
                                    <i class="ph ph-trash text-[15px]"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div
                    class="flex flex-col justify-end sm:flex-row items-center gap-4 px-6 py-4 border-t border-slate-200 bg-white text-sm text-slate-600"
            >
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 font-medium"
                >Rows per page:</span>
                        <form th:action="@{/admin/users}" method="get">
                            <input type="hidden" name="page" value="0">
                            <input type="hidden" name="name" th:value="${param.name}">
                            <select name="size" onchange="this.form.submit()"
                                    class="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-lg px-2.5 py-1.5 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none cursor-pointer transition">
                                <option value="5" th:selected="${page.size == 5}">5 / trang</option>
                                <option value="10" th:selected="${page.size == 10}">10 / trang</option>
                                <option value="20" th:selected="${page.size == 20}">20 / trang</option>
                                <option value="50" th:selected="${page.size == 50}">50 / trang</option>
                            </select>
                        </form>
                    </div>
                    <span class="text-slate-300 px-3">|</span>
                    <!-- Hiển thị 1 - 5 of 15 -->
                    <span class="text-slate-500">
                        <span th:text="${page.totalElements == 0 ? 0 : page.number * page.size + 1}">1</span>
                        -
                        <span th:text="${page.number * page.size + page.numberOfElements}">5</span>
                        of
                        <span th:text="${page.totalElements}">15</span>
                    </span>

                    <!-- Previous -->
                    <a th:if="${page.hasPrevious()}"
                       th:href="@{/admin/users(page=${page.number - 1}, size=${page.size}, name=${param.name})}"
                       class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:text-blue-600 hover:bg-blue-50 hover:border-blue-200 transition"
                       title="Trang trước">
                        <i class="ph ph-caret-left text-base"></i>
                    </a>
                    <button th:unless="${page.hasPrevious()}"
                            disabled
                            class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition disabled:opacity-40 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                            title="Trang trước">
                        <i class="ph ph-caret-left text-base"></i>
                    </button>

                    <!-- Next -->
                    <a th:if="${page.hasNext()}"
                       th:href="@{/admin/users(page=${page.number + 1}, size=${page.size}, name=${param.name})}"
                       class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:text-blue-600 hover:bg-blue-50 hover:border-blue-200 transition"
                       title="Trang sau">
                        <i class="ph ph-caret-right text-base"></i>
                    </a>

                    <button th:unless="${page.hasNext()}"
                            disabled
                            class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition disabled:opacity-40 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                            title="Trang sau">
                        <i class="ph ph-caret-right text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirm Delete -->
    <div id="deleteModal"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
            <div class="text-center">
                <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100">
                    <i class="ph ph-warning text-2xl text-red-600"></i>
                </div>
                <h3 class="mb-2 text-lg font-semibold text-slate-800">Xác nhận xóa</h3>
                <p class="mb-6 text-sm text-slate-600">Bạn có chắc chắn muốn xóa user này? Hành động này không thể hoàn
                    tác.</p>
                <div class="flex justify-center gap-3">
                    <button id="cancelDeleteBtn"
                            class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition-colors">
                        Hủy bỏ
                    </button>
                    <a id="confirmDeleteLink"
                       href="#"
                       class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors">
                        Xóa
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
