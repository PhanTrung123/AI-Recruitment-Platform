<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/AdminLayout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userIdSelect = document.getElementById('userId');
            const userEmailInput = document.getElementById('userEmail');

            if (userIdSelect && userEmailInput) {
                userIdSelect.addEventListener('change', function() {
                    const selectedOption = this.options[this.selectedIndex];
                    const text = selectedOption.text;
                    const emailMatch = text.match(/\(([^)]+)\)/);
                    if (emailMatch && emailMatch[1]) {
                        userEmailInput.value = emailMatch[1];
                    } else {
                        userEmailInput.value = '';
                    }
                });
            }
        });
    </script>
</head>
<body>
<div layout:fragment="content" class="min-h-[calc(100vh-80px)] flex flex-col justify-center items-center py-6">
    <div class="flex flex-col justify-center items-center mx-auto h-full w-full max-w-3xl">
        <form th:object="${company}" th:action="@{/admin/companies/save}" method="post"
              class="w-full bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden text-left mx-4 sm:mx-0 max-h-[90vh] overflow-y-auto overflow-hidden"
        >
            <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 th:text="${company.isEdit?'modal edit company':'modal add company'}"
                    class="text-lg font-semibold text-slate-800 capitalize">
                </h2>
            </div>

            <div class="p-6 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                            Company Name <span class="text-red-500">*</span>
                        </label>

                        <!-- cần lấy id thì mới chỉnh sửa được nên ẩn id đi  -->
                        <input
                                type="text" id="company_id" th:field="*{company_id}"
                                class="hidden"
                        />

                        <input type="text" id="companyName" th:field="*{name}"
                               placeholder="Nhập tên công ty..."
                               class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400"
                        />
                        <p th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}"
                           class="text-red-500 text-xs mt-1">
                        </p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                            Người thành lập công ty <span class="text-red-500">*</span>
                        </label>
                        <select id="userId" th:field="*{userId}"
                                class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                        >
                            <option value="">Chọn người thành lập...</option>
                            <option th:each="recruiter : ${recruiters}"
                                    th:value="${recruiter.id}"
                                    th:text="${recruiter.userName + ' (' + recruiter.email + ')'}">
                            </option>
                        </select>
                        <p th:if="${#fields.hasErrors('userId')}"
                           th:errors="*{userId}"
                           class="text-red-500 text-xs mt-1">
                        </p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                            Email người thành lập
                        </label>
                        <input type="text" id="userEmail" th:field="*{userEmail}"
                               placeholder="Email sẽ hiển thị sau khi chọn người thành lập"
                               readonly
                               class="w-full bg-slate-50 text-sm text-slate-600 border border-slate-200 rounded-lg px-4 py-2.5 cursor-not-allowed"
                        />
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                            Website
                        </label>
                        <input
                                type="url" id="website" th:field="*{website}"
                                placeholder="https://example.com"
                                class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400"
                        />
                        <p th:if="${#fields.hasErrors('website')}"
                           th:errors="*{website}"
                           class="text-red-500 text-xs mt-1">
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                            Company Size
                        </label>
                        <select id="size" th:field="*{size}"
                                class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                        >
                            <option value="">Chọn quy mô công ty...</option>
                            <option value="1-50">1 - 50 nhân viên</option>
                            <option value="50-200">50 - 200 nhân viên</option>
                            <option value="200-500">200 - 500 nhân viên</option>
                            <option value="500-1000">500 - 1000 nhân viên</option>
                            <option value="1000+">1000+ nhân viên</option>
                        </select>
                        <p th:if="${#fields.hasErrors('size')}"
                           th:errors="*{size}"
                           class="text-red-500 text-xs mt-1">
                        </p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                            Country
                        </label>
                        <input
                                type="text" id="country" th:field="*{country}"
                                placeholder="Việt Nam, Singapore..."
                                class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400"
                        />
                        <p th:if="${#fields.hasErrors('country')}"
                           th:errors="*{country}"
                           class="text-red-500 text-xs mt-1">
                        </p>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                        Address
                    </label>
                    <input
                            type="text" id="address" th:field="*{address}"
                            placeholder="Nhập địa chỉ trụ sở..."
                            class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400"
                    />
                    <p th:if="${#fields.hasErrors('address')}"
                       th:errors="*{address}"
                       class="text-red-500 text-xs mt-1">
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                        Logo URL / File
                    </label>
                    <input
                            type="text" id="logo" th:field="*{logo}"
                            placeholder="Nhập link URL logo công ty..."
                            class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400"
                    />
                    <p th:if="${#fields.hasErrors('logo')}"
                       th:errors="*{logo}"
                       class="text-red-500 text-xs mt-1">
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">
                        Description
                    </label>
                    <textarea id="description" th:field="*{description}"
                              rows="3"
                              placeholder="Nhập thông tin chi tiết về công ty..."
                              class="w-full bg-white text-sm text-slate-800 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400 resize-none"
                    ></textarea>
                    <p th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}"
                       class="text-red-500 text-xs mt-1">
                    </p>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">

                <a th:href="@{/admin/companies}"
                   class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
                    Cancel
                </a>

                <button th:text="${company.isEdit?'Edit':'Add'}" type="submit"
                        class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm transition-colors cursor-pointer"
                >
                </button>

            </div>
        </form>
    </div>
</div>
</body>
</html>
