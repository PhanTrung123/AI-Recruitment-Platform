<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/AdminLayout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content">
    <div class="w-full px-6 py-4 ">
        <!-- Success/Error Message -->
        <div th:if="${message}"
             class="mb-4 px-4 py-3 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 text-sm font-medium">
            <span th:text="${message}"></span>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
            <h2 class="text-xl font-bold text-slate-800">List Companies</h2>
            <form class="relative w-full sm:w-80">
                <button type="submit"
                        class="ph ph-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">
                </button>
                <input
                        name="name"
                        type="text"
                        placeholder="Search Company..."
                        class="w-full border-slate-200 text-md font-semibold text-slate-600  px-4 py-3 rounded-full border focus:border-blue-500 focus:bg-white outline-none transition-all"
                />
            </form>

            <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
                <a th:href="@{/admin/companies/add}"
                   id="openModalBtn"
                   class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-5 py-2 rounded-full flex items-center justify-center gap-2 text-sm font-medium transition-all shadow-sm">
                    <span>Add</span>
                    <i class="ph ph-plus font-bold text-base"></i>
                </a>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[1000px]">
                    <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <th class="py-4 px-4 w-12 text-center">STT</th>
                        <th class="py-4 px-4 w-16 text-center">Logo</th>
                        <th class="py-4 px-4 w-48">Name</th>
                        <th class="py-4 px-4 w-48">Description</th>
                        <th class="py-4 px-4 w-32">Website</th>
                        <th class="py-4 px-4 w-24">Size</th>
                        <th class="py-4 px-4 w-48">Address</th>
                        <th class="py-4 px-4 w-28">Country</th>
                        <th class="py-4 px-4 w-24">Status</th>
                        <th class="py-4 px-4 text-center w-28">Action</th>
                    </tr>
                    </thead>
                    <tbody class="text-sm">
                    <!-- Row 1 -->
                    <tr th:each="company, iterStat : ${page.content}"
                        class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                        <td th:text="${iterStat.index + page.number * page.size + 1}"
                            class="py-4 px-4 font-medium text-slate-700 text-center">
                        </td>
                        <td class="py-4 px-4 text-center">
                            <img th:src="${company.logo}"
                                 alt="Logo"
                                 class="w-10 h-10 rounded-lg object-contain border border-slate-200 mx-auto">
                        </td>
                        <td class="py-4 px-4 font-semibold text-slate-800">
                            <span th:text="${company.name}" class="line-clamp-2"></span>
                        </td>
                        <td th:text="${company.description}" th:title="${company.description}"
                            class="py-4 px-4 text-slate-600 max-w-[12rem] truncate">
                        </td>
                        <td class="py-4 px-4 text-blue-600 hover:underline">
                            <a th:href="${company.website}" th:text="${company.website}" target="_blank">
                            </a>
                        </td>
                        <td th:text="${company.size}" class="py-4 px-4 text-slate-600"></td>
                        <td th:text="${company.address}" th:title="${company.address}"
                            class="py-4 px-4 text-slate-600 max-w-[12rem] truncate">
                        </td>
                        <td th:text="${company.country}" class="py-4 px-4 text-slate-600"></td>
                        <td class="py-4 px-4 relative">
                            <div class="relative inline-block">
                                <button
                                        th:if="${company.status == T(com.quangtrung.HireAI.enums.CompanyStatus).PENDING}"
                                        type="button"
                                        th:data-company-id="${company.company_id}"
                                        onclick="toggleStatusDropdown(this)"
                                        class="inline-flex items-center gap-2 rounded-full border border-amber-200
                   bg-amber-50 px-3 py-1.5 text-xs font-semibold text-amber-700
                   shadow-sm transition-all duration-200
                   hover:border-amber-300 hover:bg-amber-100
                   focus:outline-none focus:ring-2 focus:ring-amber-200">

                                    <span class="h-2 w-2 rounded-full bg-amber-500"></span>
                                    <span>PENDING</span>
                                    <i class="ph ph-caret-down text-xs transition-transform"></i>
                                </button>

                                <span
                                        th:if="${company.status == T(com.quangtrung.HireAI.enums.CompanyStatus).APPROVED}"
                                        class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200
                   bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-700">
            <i class="ph ph-check-circle text-sm"></i>
            APPROVED
        </span>

                                <span
                                        th:if="${company.status == T(com.quangtrung.HireAI.enums.CompanyStatus).REJECTED}"
                                        class="inline-flex items-center gap-1.5 rounded-full border border-red-200
                   bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-700">
            <i class="ph ph-x-circle text-sm"></i>
            REJECTED
        </span>

                                <!-- Dropdown menu -->
                                <div
                                        th:if="${company.status == T(com.quangtrung.HireAI.enums.CompanyStatus).PENDING}"
                                        th:id="'dropdown-' + ${company.company_id}"
                                        class="status-dropdown fixed left-0 top-0 z-[10000] hidden
                   w-44 rounded-xl border border-slate-200 bg-white p-1.5
                   shadow-2xl ring-1 ring-black/5">

                                    <div class="px-3 pb-2 pt-2">
                                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                                            Company review
                                        </p>
                                    </div>
                                    <a
                                            th:href="@{/admin/companies/approve/{id}(id=${company.company_id})}"
                                            class="flex items-center gap-3 rounded-lg px-3 py-2.5
                       text-sm font-medium text-slate-700
                       transition-colors hover:bg-emerald-50 hover:text-emerald-700">
                <span class="flex h-8 w-8 items-center justify-center rounded-lg
                             bg-emerald-100 text-emerald-600">
                    <i class="ph ph-check-circle text-lg"></i>
                </span>
                                        <span>Approve</span>
                                    </a>
                                    <a
                                            th:href="@{/admin/companies/reject/{id}(id=${company.company_id})}"
                                            class="flex items-center gap-3 rounded-lg px-3 py-2.5
                       text-sm font-medium text-slate-700
                       transition-colors hover:bg-red-50 hover:text-red-700">

                <span class="flex h-8 w-8 items-center justify-center rounded-lg
                             bg-red-100 text-red-600">
                    <i class="ph ph-x-circle text-lg"></i>
                </span>

                                        <span>Reject</span>
                                    </a>
                                </div>
                            </div>
                        </td>
                        <td class="py-4 px-4">
                            <div class="flex items-center justify-center gap-2">
                                <a th:href="@{/admin/companies/edit/{id}(id=${company.company_id})}"
                                   class="w-8 h-8 flex items-center justify-center rounded-lg border border-blue-200 bg-blue-50 text-blue-600 hover:bg-blue-100 transition-all duration-200"
                                   title="Chỉnh sửa"
                                >
                                    <i class="ph ph-pencil-simple text-[15px]"></i>
                                </a>
                                <button
                                        type="button"
                                        class="delete-btn w-8 h-8 flex items-center justify-center rounded-lg border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 transition-all duration-200"
                                        th:data-url="@{/admin/companies/delete/{id}(id=${company.company_id})}"
                                        title="Xóa"
                                >
                                    <i class="ph ph-trash text-[15px]"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="flex flex-col justify-end sm:flex-row items-center gap-4 px-6 py-4 border-t border-slate-200 bg-white text-sm text-slate-600">
                <!-- Pagination -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-500 font-medium">Rows per page:</span>
                        <form th:action="@{/admin/companies}" method="get">
                            <input type="hidden" name="page" value="0">
                            <input type="hidden" name="name" th:value="${param.name}">
                            <select name="size" onchange="this.form.submit()"
                                    class="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-lg px-2.5 py-1.5 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none cursor-pointer transition">
                                <option value="5" th:selected="${page.size == 5}">5 / trang</option>
                                <option value="10" th:selected="${page.size == 10}">10 / trang</option>
                                <option value="20" th:selected="${page.size == 20}">20 / trang</option>
                                <option value="50" th:selected="${page.size == 50}">50 / trang</option>
                            </select>
                        </form>
                    </div>
                    <span class="text-slate-300 px-3">|</span>
                    <span class="text-slate-500">
                        <span th:text="${page.totalElements == 0 ? 0 : page.number * page.size + 1}">1</span>
                        -
                        <span th:text="${page.number * page.size + page.numberOfElements}">5</span>
                        of
                        <span th:text="${page.totalElements}">15</span>
                    </span>
                    <!-- Previous -->
                    <a th:if="${page.hasPrevious()}"
                       th:href="@{/admin/companies(page=${page.number - 1}, size=${page.size}, name=${param.name})}"
                       class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:text-blue-600 hover:bg-blue-50 hover:border-blue-200 transition"
                       title="Trang trước">
                        <i class="ph ph-caret-left text-base"></i>
                    </a>
                    <button th:unless="${page.hasPrevious()}"
                            disabled
                            class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition disabled:opacity-40 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                            title="Trang trước">
                        <i class="ph ph-caret-left text-base"></i>
                    </button>
                    <!-- Next -->
                    <a th:if="${page.hasNext()}"
                       th:href="@{/admin/companies(page=${page.number + 1}, size=${page.size}, name=${param.name})}"
                       class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:text-blue-600 hover:bg-blue-50 hover:border-blue-200 transition"
                       title="Trang sau">
                        <i class="ph ph-caret-right text-base"></i>
                    </a>

                    <button th:unless="${page.hasNext()}"
                            disabled
                            class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition disabled:opacity-40 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                            title="Trang sau">
                        <i class="ph ph-caret-right text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirm Delete -->
    <div id="deleteModal"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
            <div class="text-center">
                <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-600">
                    <i class="ph ph-warning text-2xl"></i>
                </div>
                <h3 class="text-lg font-semibold text-gray-900">Xác nhận xóa</h3>
                <p class="mt-2 text-sm text-gray-500">Bạn có chắc chắn muốn xóa mục này?</p>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button id="cancelDeleteBtn" type="button"
                        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Hủy
                </button>
                <a id="confirmDeleteLink"
                   href="#"
                   class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 flex items-center justify-center">
                    Xóa
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleStatusDropdown(element) {
            const companyId = element.getAttribute('data-company-id');
            const dropdown = document.getElementById('dropdown-' + companyId);

            if (!dropdown) return;

            const isOpen = !dropdown.classList.contains('hidden');

            // Đóng tất cả dropdown khác
            document.querySelectorAll('.status-dropdown').forEach(dd => {
                dd.classList.add('hidden');
            });

            if (isOpen) return;

            document.body.appendChild(dropdown);

            dropdown.style.position = 'fixed';
            dropdown.style.zIndex = '10000';
            dropdown.classList.remove('hidden');

            const rect = element.getBoundingClientRect();
            const menuWidth = dropdown.offsetWidth;
            const menuHeight = dropdown.offsetHeight;
            const gap = 6;
            const padding = 12;

            let top = rect.bottom + gap;
            let left = rect.left;

            if (top + menuHeight > window.innerHeight - padding) {
                top = rect.top - menuHeight - gap;
            }

            left = Math.min(left, window.innerWidth - menuWidth - padding);
            left = Math.max(padding, left);
            top = Math.max(padding, top);

            dropdown.style.top = top + 'px';
            dropdown.style.left = left + 'px';
        }

        document.addEventListener('click', function (event) {
            if (
                !event.target.closest('.status-dropdown') &&
                !event.target.closest('[data-company-id][onclick]')
            ) {
                document.querySelectorAll('.status-dropdown').forEach(dd => {
                    dd.classList.add('hidden');
                });
            }
        });

        // Nhấn Escape để đóng dropdown
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                document.querySelectorAll('.status-dropdown').forEach(dd => {
                    dd.classList.add('hidden');
                });
            }
        });

        // Đóng dropdown khi cuộn trang
        window.addEventListener('scroll', function () {
            document.querySelectorAll('.status-dropdown').forEach(dd => {
                dd.classList.add('hidden');
            });
        }, true);

        // Đóng dropdown khi thay đổi kích thước cửa sổ
        window.addEventListener('resize', function () {
            document.querySelectorAll('.status-dropdown').forEach(dd => {
                dd.classList.add('hidden');
            });
        });
    </script>
</div>
</body>
</html>
